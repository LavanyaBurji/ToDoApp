{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-8">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h4 class="card-title text-danger">Unexpected Error</h4>
        <p class="card-text">An unexpected problem occurred. Please try again later.</p>
        <p class="text-muted small">{{ error }}</p>
        <a class="btn btn-primary" href="{{ url_for('index') }}">Back to dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
