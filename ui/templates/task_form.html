{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-4">{{ action }}</h4>
        <form method="post">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ task.title if task else '' }}" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required>{{ task.description if task else '' }}</textarea>
          </div>
          <div class="mb-3">
            <label for="due_date" class="form-label">Due Date</label>
            <input type="date" class="form-control" id="due_date" name="due_date" value="{{ task.due_date if task else '' }}" required>
          </div>
          <div class="mb-3">
            <label for="priority" class="form-label">Priority</label>
            <select class="form-select" id="priority" name="priority" required>
              <option value="High" {% if task and task.priority == 'High' %}selected{% endif %}>High</option>
              <option value="Medium" {% if task and task.priority == 'Medium' %}selected{% endif %}>Medium</option>
              <option value="Low" {% if task and task.priority == 'Low' %}selected{% endif %}>Low</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
